[pairs]
symbols = ["BTCEUR", "ETHEUR", "XRPEUR", "SOLEUR"]
#symbols = ["BTCEUR"]

[timeframes]
execution = "1h"

[strategy]
min_score_alert = 80

[strategy.macro_filter]
ema_period = 200
use_supertrend = true
supertrend_period = 10
supertrend_multiplier = 3.0

[strategy.adx]
period = 14
min_threshold = 22.0

[strategy.volume]
sma_period = 20
multiplier = 1.2

[network]
rate_limit_ms = 200
# proxy = "http://127.0.0.1:9000"

[data_sources]
providers = ["binance", "kraken", "coinbase"]

[logs]
retention_days = 7

[ui]
# Intervalle de lecture de l'état du moteur par l'IHM (100 à 60000 ms). Le moteur s'en sert
# aussi pour déclarer déconnectée une IHM muette depuis 3 × cet intervalle + 10 s.
refresh_ms = 1000

[telegram]
# Ne pas mettre le jeton ici (fichier versionné) : utiliser .telegram.toml à côté de
# config.toml (ignoré par git) ou les variables PREDICT_TELEGRAM_TOKEN / PREDICT_TELEGRAM_CHAT_ID.
bot_token = ""
chat_id = ""

[telegram.notifications]
# Notifications envoyées ; se choisissent dans l'IHM (menu « 🔔 Telegram »), qui réécrit
# cette section. Absentes : envoyées.
engine_start = true    # « Moteur démarré » à chaque lancement d'un mode
engine_stop = true     # « Moteur arrêté » à l'arrêt du processus
ui_connection = true   # connexion / déconnexion des IHM (mode --serve)
trend_reversal = true  # retournements de tendance en temps réel

# Réglages par paire : ils se gèrent dans l'IHM (Copier / Coller / Copier vers… / Sauvegarder)
# et sont enregistrés dans parametres.toml, prioritaire sur ce fichier. [strategy] ci-dessus
# n'est utilisé qu'en l'absence de parametres.toml.
# Anciennes sections encore acceptées : [groups.<nom>] (symbols + strategy) et
# [overrides.<SYMBOLE>] ; elles sont converties en réglages propres de chaque paire.
